<!DOCTYPE html>
<html lang="ko" data-theme="green">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세종새누리교회 비용지출요청 로그인</title>
    <link rel="stylesheet" href="css/style.css?v=20260812_27">
</head>
<body style="background: linear-gradient(135deg, #f4f7f4 0%, #e8f5e9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px;">

    <div class="card landing-box" style="background: #ffffff; border: 1px solid #d1fae5;">
        
        <!-- ⛪ 세종새누리교회 캘리그라피 로고 -->
        <div style="margin-bottom: 14px; text-align: center;">
            <img src="images/logo.png" alt="세종새누리교회" class="landing-logo-img" style="box-shadow:none; border-radius:0;">
        </div>

        <!-- 📌 메인 타이틀 & 스마트 감성 시간대 환영 인사말 -->
        <h1 style="font-size: 24px; font-weight: 800; color: #54824e; margin-bottom: 4px; letter-spacing:-0.5px;">
            비용지출요청
        </h1>

        <!-- ☀️ 시간대별 감성 환영 인사말 (어색한 위치 감지 문구 완전 삭제!) -->
        <div id="greeting-welcome-box" style="font-size: 13.5px; color: #047857; background-color: #f0fdf4; border: 1px solid #bbf7d0; padding: 9px 12px; border-radius: 8px; margin-bottom: 18px; font-weight: 600;">
            ✨ 평안하고 은혜로운 밤입니다, 성도님!<br>
            <span style="font-size: 12px; color: #64748b; font-weight: normal;">스마트하게 소통하는 새누리 온라인 마당</span>
        </div>

        <!-- 🔑 소셜 로그인 버튼 구획 -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <button type="button" class="btn-social btn-kakao" onclick="handleSocialLogin('kakao')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#191919">
                    <path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.707 4.8 4.27 6.054-.188.702-.682 2.545-.78 2.94-.12.483.177.476.372.347.155-.102 2.463-1.674 3.456-2.35.545.08 1.107.124 1.682.124 4.97 0 9-3.186 9-7.115S16.97 3 12 3z"/>
                </svg>
                카카오톡으로 시작하기
            </button>

            <button type="button" class="btn-social btn-google" onclick="handleSocialLogin('google')">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                구글 계정으로 시작하기
            </button>
        </div>

        <!-- 🔒 자동 로그인 유지 체크박스 -->
        <label class="auto-login-check">
            <input type="checkbox" id="auto-login-token" checked>
            <span>스마트폰 로그인 상태 자동 유지</span>
        </label>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderSmartGreeting();
        });

        function renderSmartGreeting() {
            const hour = new Date().getHours();
            let greetingText = "";

            if (hour >= 5 && hour < 12) {
                greetingText = "☀️ 상쾌하고 은혜로운 아침입니다, 성도님!";
            } else if (hour >= 12 && hour < 18) {
                greetingText = "🌿 평안한 오후입니다, 성도님!";
            } else {
                greetingText = "✨ 평안하고 은혜로운 밤입니다, 성도님!";
            }

            const box = document.getElementById('greeting-welcome-box');
            if (box) {
                box.innerHTML = `${greetingText}<br><span style="font-size:12px; color:#64748b; font-weight:normal;">스마트하게 소통하는 새누리 온라인 마당</span>`;
            }
        }

        function handleSocialLogin(provider) {
            const isAuto = document.getElementById('auto-login-token').checked;
            if (isAuto) {
                localStorage.setItem('saenuri_auto_login', 'true');
            }
            if (provider === 'kakao') {
                location.href = 'auth/kakao_login.php';
            } else if (provider === 'google') {
                location.href = 'auth/google_login.php';
            } else {
                location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
